<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PORT LOGISTICS • Secure Access</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    body {
      background: radial-gradient(circle at top, rgba(14, 116, 144, 0.22), transparent 35%),
                  linear-gradient(135deg, #071321 0%, #0b1326 42%, #111b30 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .login-shell {
      width: min(1180px, 95vw);
      min-height: 760px;
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      border-radius: 28px;
      overflow: hidden;
      background: rgba(15, 23, 42, 0.78);
      border: 1px solid rgba(148, 163, 184, 0.18);
      box-shadow: 0 30px 80px rgba(2, 6, 23, 0.7);
      backdrop-filter: blur(12px);
    }

    .visual-panel {
      position: relative;
      background:
        linear-gradient(180deg, rgba(11, 19, 38, 0.40), rgba(11, 19, 38, 0.78)),
        url("{{ url_for('static', filename='assets/port-terminal-hero.svg') }}") center/cover no-repeat;
      position: relative;
      padding: 2.5rem;
      display: flex;
      align-items: flex-end;
      min-height: 500px;
    }

    .visual-panel::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(2, 6, 23, 0.05), rgba(2, 6, 23, 0.72));
    }

    .visual-content {
      position: relative;
      z-index: 1;
      color: #e2e8f0;
      max-width: 560px;
    }

    .status-label {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.5rem 0.9rem;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(12, 18, 31, 0.35);
      border-radius: 999px;
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      font-weight: 600;
      text-transform: uppercase;
      color: rgba(255,255,255,0.78);
      backdrop-filter: blur(8px);
    }

    .status-label .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 12px rgba(34, 197, 94, 0.9);
    }

    .visual-content h1 {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(2.8rem, 4vw, 4.5rem);
      line-height: 0.95;
      letter-spacing: -0.06em;
      margin: 1.1rem 0 0.7rem;
      font-weight: 800;
    }

    .visual-content p {
      font-size: 1.1rem;
      line-height: 1.7;
      color: rgba(226, 232, 240, 0.88);
      max-width: 480px;
      margin: 0;
    }

    .login-panel {
      background: rgba(9, 15, 25, 0.92);
      padding: 2.6rem 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-card {
      width: min(100%, 420px);
    }

    .brand-lockup {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      margin-bottom: 1.4rem;
    }

    .brand-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      box-shadow: 0 0 22px rgba(79, 172, 254, 0.4);
      color: #06131d;
      font-size: 1.35rem;
      font-weight: 700;
    }

    .brand-title {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      letter-spacing: -0.04em;
      font-size: 1.5rem;
      color: rgba(255,255,255,0.98);
      margin: 0;
    }

    .brand-sub {
      color: rgba(148, 163, 184, 0.95);
      font-size: 0.76rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-top: 0.18rem;
    }

    .login-head {
      margin: 0 0 1.4rem;
    }

    .login-head h2 {
      font-family: 'Outfit', sans-serif;
      letter-spacing: -0.05em;
      font-weight: 700;
      margin: 0 0 0.4rem;
      color: #f8fafc;
    }

    .login-head p {
      color: rgba(148, 163, 184, 0.9);
      margin: 0;
      font-size: 0.95rem;
    }

    .form-label {
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(148, 163, 184, 0.9);
      margin-bottom: 0.5rem;
    }

    .input-wrap {
      position: relative;
      margin-bottom: 1rem;
    }

    .input-wrap i {
      position: absolute;
      left: 0.9rem;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(148, 163, 184, 0.85);
      font-size: 0.95rem;
    }

    .login-input {
      width: 100%;
      border: 1px solid rgba(148, 163, 184, 0.18);
      background: rgba(15, 23, 42, 0.7);
      border-radius: 12px;
      color: #e2e8f0;
      padding: 0.92rem 1rem 0.92rem 2.7rem;
      outline: none;
      transition: all 0.2s ease;
      box-shadow: none;
    }

    .login-input:focus {
      border-color: rgba(6, 182, 212, 0.9);
      box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.12);
      background: rgba(15, 23, 42, 0.82);
    }

    .password-toggle {
      position: absolute;
      right: 0.8rem;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      color: rgba(148, 163, 184, 0.9);
      font-size: 0.9rem;
      cursor: pointer;
    }

    .login-button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 0.95rem 1rem;
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      color: #06131d;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      box-shadow: 0 16px 30px rgba(79, 172, 254, 0.25);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      margin-top: 0.3rem;
    }

    .login-button:hover {
      transform: translateY(-1px);
      box-shadow: 0 18px 34px rgba(79, 172, 254, 0.35);
    }

    .login-button:disabled {
      opacity: 0.7;
      cursor: progress;
    }

    .error-box {
      min-height: 22px;
      margin-top: 0.7rem;
      color: #fca5a5;
      background: rgba(127, 29, 29, 0.18);
      border: 1px solid rgba(248, 113, 113, 0.2);
      border-radius: 10px;
      padding: 0.7rem 0.8rem;
      font-size: 0.86rem;
      display: none;
    }

    .error-box.visible {
      display: block;
    }

    .system-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-top: 1.25rem;
      color: rgba(148, 163, 184, 0.8);
      font-size: 0.75rem;
    }

    @media (max-width: 960px) {
      .login-shell {
        grid-template-columns: 1fr;
        min-height: auto;
      }

      .visual-panel {
        min-height: 380px;
      }

      .login-panel {
        padding: 2rem 1.2rem 2.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="login-shell">
    <div class="visual-panel">
      <div class="visual-overlay"></div>
      <div class="visual-content">
        <div class="status-label"><span class="dot"></span> Terminal Alpha • Secure Operations Access</div>
        <h1>PORT LOGISTICS</h1>
        <p>AI-Powered Smart Port &amp; Logistics Management System</p>
      </div>
    </div>

    <div class="login-panel">
      <div class="login-card">
        <div class="brand-lockup">
          <div class="brand-icon"><i class="fa-solid fa-anchor"></i></div>
          <div>
            <div class="brand-title">PORT LOGISTICS</div>
            <div class="brand-sub">Secure Terminal Access</div>
          </div>
        </div>

        <div class="login-head">
          <h2>Welcome Back</h2>
          <p>Sign in to continue operations monitoring.</p>
        </div>

        <form id="loginForm" method="post" action="{{ url_for('login_page') }}">
          <div class="mb-3">
            <label class="form-label" for="email">Email / Username</label>
            <div class="input-wrap">
              <i class="fa-solid fa-user"></i>
              <input class="login-input" id="email" name="email" type="text" value="gowthamiproject1@gmail.com" autocomplete="username" required>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <div class="input-wrap">
              <i class="fa-solid fa-lock"></i>
              <input class="login-input" id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
              <button type="button" class="password-toggle" id="togglePassword" aria-label="Show password"><i class="fa-solid fa-eye"></i></button>
            </div>
          </div>

          <button class="login-button" id="loginButton" type="submit">
            <span class="button-label">Sign In</span>
          </button>

          <div class="error-box{% if error %} visible{% endif %}" id="loginErrorBox">
            {% if error %}{{ error }}{% endif %}
          </div>
        </form>

        <div class="system-foot">
          <span>Operational environment</span>
          <span>PortOps • Demo</span>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const passwordInput = document.getElementById('password');
    const togglePassword = document.getElementById('togglePassword');
    const loginForm = document.getElementById('loginForm');
    const loginButton = document.getElementById('loginButton');
    const loginErrorBox = document.getElementById('loginErrorBox');

    togglePassword.addEventListener('click', function () {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      this.innerHTML = isPassword ? '<i class="fa-solid fa-eye-slash"></i>' : '<i class="fa-solid fa-eye"></i>';
      this.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
    });

    loginForm.addEventListener('submit', function () {
      loginButton.disabled = true;
      loginButton.querySelector('.button-label').textContent = 'Signing In...';
      if (loginErrorBox) {
        loginErrorBox.classList.remove('visible');
        loginErrorBox.textContent = '';
      }
    });
  </script>
</body>
</html>
